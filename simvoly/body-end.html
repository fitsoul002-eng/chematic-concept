<script>
// Chematic Com — guilloche patterns, mobile menu, stamp impressions and Simvoly form placement.
(function () {
  // Never touch the Simvoly editor; only run on the published site.
  if (/^\/me(\/|$)/.test(location.pathname)) return;

  var NS = 'http://www.w3.org/2000/svg';

  function path(d) {
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    return p;
  }

  // Closed rosette curve: radius modulated by two harmonics, rotated per layer.
  function rosette(R, a, n, b, m, phase, steps) {
    var d = '';
    for (var i = 0; i <= steps; i++) {
      var t = (i / steps) * Math.PI * 2;
      var r = R + a * Math.sin(n * t + phase) + b * Math.cos(m * t - phase * 2);
      d += (i ? 'L' : 'M') + (r * Math.cos(t)).toFixed(2) + ' ' + (r * Math.sin(t)).toFixed(2);
    }
    return d + 'Z';
  }

  var builders = {
    rosette: function (g) {
      for (var k = 0; k < 36; k++) g.appendChild(path(rosette(205, 48, 18, 14, 7, k * 0.175, 900)));
      for (k = 0; k < 24; k++) g.appendChild(path(rosette(118, 22, 12, 8, 5, k * 0.26, 600)));
      for (k = 0; k < 14; k++) g.appendChild(path(rosette(268, 10, 30, 6, 15, k * 0.21, 1200)));
    },
    'rosette-small': function (g) {
      for (var k = 0; k < 28; k++) g.appendChild(path(rosette(200, 40, 16, 12, 8, k * 0.22, 800)));
    },
    seal: function (g) {
      g.setAttribute('transform', 'translate(24 24)');
      for (var k = 0; k < 10; k++) g.appendChild(path(rosette(13, 2.4, 10, 1, 5, k * 0.6, 240)));
    },
    waves: function (g) {
      for (var k = 0; k < 26; k++) {
        var d = '', y0 = 40 + k * 13;
        for (var x = 0; x <= 1200; x += 6) {
          var y = y0 + 22 * Math.sin(x / 95 + k * 0.32) + 9 * Math.sin(x / 31 - k * 0.5);
          d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);
        }
        g.appendChild(path(d));
      }
    }
  };

  function init() {
    document.querySelectorAll('.cc').forEach(function (el) { el.classList.add('js'); });

    document.querySelectorAll('[data-guilloche]').forEach(function (g) {
      var build = builders[g.getAttribute('data-guilloche')];
      if (build && !g.childNodes.length) build(g);
    });

    // Current page in the menu.
    var here = location.pathname.replace(/\/+$/, '') || '/';
    if (here === '/home' || here === '/acasa') here = '/';
    document.querySelectorAll('.cc .nav a[data-path]').forEach(function (a) {
      if (a.getAttribute('data-path') === here) a.setAttribute('aria-current', 'page');
    });

    // Mobile menu.
    var nav = document.querySelector('.cc .nav');
    var burger = nav && nav.querySelector('.nav__burger');
    if (burger) {
      burger.addEventListener('click', function () {
        var open = nav.classList.toggle('is-open');
        burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      nav.querySelectorAll('.nav__drawer a').forEach(function (a) {
        a.addEventListener('click', function () { nav.classList.remove('is-open'); burger.setAttribute('aria-expanded', 'false'); });
      });
    }

    // Destination stamps impress once when the visa pages enter.
    var visas = document.querySelectorAll('.cc .visa');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-stamped'); io.unobserve(e.target); }
        });
      }, { threshold: 0.45 });
      visas.forEach(function (v) { io.observe(v); });
    } else {
      visas.forEach(function (v) { v.classList.add('is-stamped'); });
    }

    // Move each Simvoly form widget into its slot in our layout (n-th form -> n-th slot).
    var slots = document.querySelectorAll('.cc [data-form-slot]');
    var forms = Array.prototype.filter.call(
      document.querySelectorAll('.widget[data-type="FormWidget"], .widgetForm'),
      function (w) { return !w.closest('.cc') && !(w.parentElement && w.parentElement.closest('.widgetForm')); }
    );
    slots.forEach(function (slot, i) {
      var w = forms[i];
      if (!w) return;
      var row = w.closest('.grid-row');
      slot.appendChild(w);
      if (row && !row.querySelector('.widget')) row.classList.add('cc-emptied');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
